<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06090d">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="6;url=https://mhd241.github.io/JetVault/index.html">
  <title>Scottish.aero has moved — JetVault</title>

  <style>
    :root{
      --bg:#06090d;
      --panel:#0b121a;
      --line:rgba(255,255,255,.11);
      --text:#f4f7fb;
      --muted:#91a0b0;
      --blue:#78b9ff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      overflow:hidden;
      background:
        radial-gradient(circle at 75% 15%,rgba(120,185,255,.12),transparent 34%),
        radial-gradient(circle at 18% 82%,rgba(120,185,255,.06),transparent 28%),
        #06090d;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.08;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
      background-size:72px 72px;
      mask-image:linear-gradient(to bottom,#000,transparent 90%);
    }

    .card{
      position:relative;
      width:min(760px,100%);
      padding:clamp(34px,6vw,68px);
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(145deg,rgba(14,23,34,.94),rgba(7,12,18,.94));
      box-shadow:0 35px 110px rgba(0,0,0,.45);
      backdrop-filter:blur(20px);
      text-align:center;
      overflow:hidden;
    }

    .card::after{
      content:"";
      position:absolute;
      width:320px;
      height:320px;
      right:-130px;
      top:-140px;
      border-radius:50%;
      border:1px solid rgba(120,185,255,.12);
      box-shadow:
        0 0 0 55px rgba(120,185,255,.025),
        0 0 0 110px rgba(120,185,255,.018);
      pointer-events:none;
    }

    .logo{
      width:min(320px,72vw);
      height:auto;
      margin:0 auto 34px;
      object-fit:contain;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin-bottom:14px;
      color:#b8d9fa;
      font-size:.72rem;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .eyebrow::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--blue);
      box-shadow:0 0 16px rgba(120,185,255,.75);
    }

    h1{
      margin:0;
      font-size:clamp(2.7rem,7vw,5.6rem);
      line-height:.93;
      letter-spacing:-.065em;
    }

    h1 span{
      display:block;
      color:rgba(244,247,251,.38);
    }

    p{
      max-width:590px;
      margin:24px auto 0;
      color:var(--muted);
      font-size:clamp(1rem,2vw,1.16rem);
      line-height:1.65;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:34px;
    }

    .button{
      min-height:48px;
      padding:0 22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      border-radius:999px;
      background:#fff;
      color:#061019;
      font-weight:800;
      text-decoration:none;
      transition:.2s ease;
    }

    .button:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 35px rgba(255,255,255,.12);
    }

    .url{
      display:block;
      margin-top:22px;
      color:#91bfea;
      font-size:.78rem;
      word-break:break-all;
      text-decoration:none;
    }

    .countdown{
      margin-top:30px;
      color:#708090;
      font-size:.72rem;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    @media(max-width:560px){
      body{padding:16px}
      .card{padding:38px 22px;border-radius:22px}
      .logo{margin-bottom:26px}
      .button{width:100%}
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="logo"
      src="assets/images/ui/jetvault-wordmark.png"
      alt="JetVault"
    >

    <div class="eyebrow">A new chapter</div>

    <h1>
      Scottish.aero
      <span>is now JetVault.</span>
    </h1>

    <p>
      We've moved to our new home. Aviation photography, photographers and the community
      now continue under the JetVault name.
    </p>

    <div class="actions">
      <a class="button" href="https://mhd241.github.io/JetVault/index.html">
        Continue to JetVault <span>↗</span>
      </a>
    </div>

    <a class="url" href="https://mhd241.github.io/JetVault/index.html">
      https://mhd241.github.io/JetVault/index.html
    </a>

    <div class="countdown">
      Redirecting automatically in <span id="seconds">6</span> seconds
    </div>
  </main>

  <script>
    const target = "https://mhd241.github.io/JetVault/index.html";
    let seconds = 6;
    const node = document.getElementById("seconds");

    const timer = setInterval(() => {
      seconds -= 1;
      if (node) node.textContent = Math.max(seconds, 0);

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(target);
      }
    }, 1000);
  </script>
</body>
</html>
